<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delivery verifier</title>
  <style>
    :root { color-scheme: dark; font: 15px system-ui, sans-serif; background: #0c1220; color: #eef4ff; }
    * { box-sizing: border-box; } body { margin: 0; } main { max-width: 1180px; margin: auto; padding: 28px; }
    header { display: flex; justify-content: space-between; gap: 20px; align-items: end; margin-bottom: 24px; }
    h1 { margin: 0 0 6px; font-size: 34px; } h2 { margin-top: 0; } h3 { margin-bottom: 8px; }
    .muted { color: #9babbe; } .grid { display: grid; grid-template-columns: 280px 1fr; gap: 20px; }
    .panel, .case { background: #141d2d; border: 1px solid #293a52; border-radius: 12px; padding: 18px; margin-bottom: 14px; }
    .case { cursor: pointer; } .case:hover, .case.active { border-color: #57d8c0; } .case strong { display: block; margin-bottom: 6px; }
    label { display: grid; gap: 7px; color: #aebdd0; margin: 12px 0; } input, textarea, select { width: 100%; padding: 10px; border: 1px solid #3a4b64; border-radius: 7px; background: #0d1523; color: inherit; font: inherit; }
    textarea { min-height: 100px; resize: vertical; } button { border: 0; border-radius: 7px; padding: 10px 13px; background: #59dfc4; color: #062824; font-weight: 700; cursor: pointer; margin: 4px 4px 4px 0; } button:disabled { opacity: .4; cursor: not-allowed; }
    button.secondary { background: #29476a; color: #e4efff; } button.danger { background: #713343; color: #ffe2e7; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 99px; background: #24405a; color: #9ff7df; font-size: 12px; } .hidden { display: none; }
    .criterion, pre, .notice { padding: 12px; border-radius: 8px; background: #0c1525; margin: 8px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .actions { margin-top: 12px; } .error { background: #562b38; color: #ffdce3; padding: 12px; border-radius: 8px; margin-bottom: 14px; }
    a { color: #72e8ff; } .timeline { border-left: 2px solid #38516d; padding-left: 14px; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } header { display: block; } }
  </style>
</head>
<body>
<main>
  <header><div><h1>Delivery verifier</h1><div class="muted">Local demo only · no authentication · PayPal credentials stay on the server</div></div><button id="refresh">Refresh cases</button></header>
  <div id="error" class="error hidden"></div>
  <div class="grid">
    <aside><section class="panel"><h2>Cases</h2><div id="cases"></div></section><section class="panel"><h3>New case</h3><form id="new-case"><label>Case ID<input name="caseId" pattern="[A-Za-z0-9._-]+" required></label><label>Client request<textarea name="brief" required></textarea></label><label>Stack and constraints<textarea name="stack" required>Node 20</textarea></label><button>Create case</button></form></section></aside>
    <section id="detail"><div class="panel muted">Select a case to begin.</div></section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let selected;
function error(message) { $("error").textContent = message; $("error").classList.remove("hidden"); }
function clearError() { $("error").classList.add("hidden"); }
async function api(url, options) { const r = await fetch(url, { headers: { "Content-Type": "application/json", ...(options?.headers || {}) }, ...options }); const b = await r.json(); if (!r.ok) throw new Error(b.error || "Request failed."); return b; }
async function loadCases() { const cases = await api("/api/cases"); $("cases").innerHTML = cases.length ? cases.map(c => `<div class="case ${c.caseId === selected ? "active" : ""}" data-id="${c.caseId}"><strong>${c.caseId}</strong><span class="badge">${c.stage}</span></div>`).join("") : "<p class='muted'>No cases yet.</p>"; document.querySelectorAll(".case").forEach(e => e.onclick = () => selectCase(e.dataset.id)); }
async function selectCase(id) { selected = id; clearError(); await loadCases(); render(await api("/api/cases/" + encodeURIComponent(id))); }
function button(label, action, disabled = false, cls = "") { return `<button class="${cls}" data-action="${action}" ${disabled ? "disabled" : ""}>${label}</button>`; }
function render(c) {
  const criteria = c.criteria || {}; const payment = c.payment || {}; const result = c.result || {}; const review = c.review || {};
  const approved = criteria.status === "approved"; const authorized = Boolean(payment.authorizationId); const submitted = c.submission;
  $("detail").innerHTML = `<section class="panel"><h2>${c.caseId} <span class="badge">${c.stage}</span></h2><p class="muted">Buyer: ${c.buyerEmail || "not configured"}</p></section>
  <section class="panel"><h3>1 · Criteria</h3><p>Status: <b>${criteria.status || "not generated"}</b> ${criteria.approvedBy ? `· approved by ${criteria.approvedBy}` : ""}</p>${(criteria.criteria || []).map(x => `<div class="criterion"><b>${x.id}</b> · ${x.criterion}<br><span class="muted">${x.method}</span></div>`).join("")}<p class="muted">${(criteria.open_questions || []).map(x => "Open question: " + x.question).join("<br>")}</p>${button("Generate criteria", "criteria", false)} ${button("Approve criteria", "approve", !criteria.criteria?.length || approved)}<label>Revision note<input id="revision-note"></label>${button("Revise criteria", "revise", false, "secondary")}</section>
  <section class="panel"><h3>2 · Funding</h3><p>Order: ${payment.orderId || "not created"} · Authorization: ${payment.authorizationId || "not recorded"}</p>${payment.approvalUrl ? `<p><a href="${payment.approvalUrl}" target="_blank" rel="noreferrer">Approve order in PayPal Sandbox</a></p><p class="muted">Approve using the configured sandbox buyer account: ${c.buyerEmail}. Confirm that this is the buyer approving the order.</p>` : ""}<label>Amount<input id="amount" value="${payment.amount || "10.00"}"></label><label>Currency<input id="currency" value="${payment.currency || "USD"}"></label>${button("Create buyer order", "fund", Boolean(payment.orderId), "secondary")} ${button("Check status", "status", !payment.orderId || authorized, "secondary")} ${authorized ? `<p>Expires: ${payment.authorizationExpirationTime || "unknown"}</p>` : ""}</section>
  <section class="panel"><h3>3 · Submission</h3><form id="upload"><input type="file" name="files" multiple webkitdirectory directory><p class="muted">Upload a folder or zip, maximum 50 MB. Files are stored under out/${c.caseId}/submission/.</p><button>Upload submission</button></form><pre>${c.submission ? "Submission files uploaded." : "No submission uploaded."}</pre></section>
  <section class="panel"><h3>4 · Verification</h3>${result.outcomes ? result.outcomes.map(x => `<div class="criterion"><b>${x.id}: ${x.result}</b><br>${JSON.stringify(x.evidence)}</div>`).join("") : "<p class='muted'>Not run.</p>"}<p>Decision: <b>${result.decision || "not run"}</b></p>${button("Run verifier", "verify", !approved || !authorized || !submitted)}<p class="muted">${!approved ? "Approve criteria first." : !authorized ? "Authorize the PayPal order first." : !submitted ? "Upload a submission first." : ""}</p></section>
  ${result.decision === "escalate" ? `<section class="panel"><h3>5 · Human review</h3><pre>${review.status || "pending"} · ${review.remaining?.text || ""}</pre>${review.markdown || ""}${button("Release", "release", review.status !== "pending")} ${button("Reject", "reject", review.status !== "pending", "danger")}</section>` : ""}
  <section class="panel"><h3>Results and history</h3>${payment.milestones?.map(x => `<p>Capture: ${x.captureId || "—"} · Payout: ${x.payoutBatchId || "—"} · ${x.payoutStatus || ""} ${x.payoutItemStatuses?.join(", ") || ""}${x.payoutNote ? `<br>${x.payoutNote}` : ""}</p>`).join("") || ""}${button("Refresh payout", "payout", !payment.milestones?.length, "secondary")}<div class="timeline">${(c.events || []).map(x => `<p><b>${x.timestamp}</b> · ${x.event} ${x.status || ""}</p>`).join("")}</div></section>`;
  document.querySelectorAll("[data-action]").forEach(b => b.onclick = () => action(b.dataset.action));
  $("upload").onsubmit = upload;
}
async function action(name) { try { clearError(); const base = "/api/cases/" + encodeURIComponent(selected); let body; let url = name === "approve" ? base + "/criteria/approve" : base + "/" + name; if (name === "fund") body = JSON.stringify({ amount: $("amount").value, currency: $("currency").value }); if (name === "revise") body = JSON.stringify({ note: $("revision-note").value }); if (name === "release" || name === "reject") { url = base + "/review"; body = JSON.stringify({ decision: name }); } await api(url, { method: "POST", body }); await selectCase(selected); } catch (e) { error(e.message); } }
async function upload(e) { e.preventDefault(); try { clearError(); const data = new FormData($("upload")); const r = await fetch("/api/cases/" + encodeURIComponent(selected) + "/upload", { method: "POST", body: data }); const b = await r.json(); if (!r.ok) throw new Error(b.error); await selectCase(selected); } catch (e) { error(e.message); } }
$("new-case").onsubmit = async e => { e.preventDefault(); try { clearError(); const f = new FormData(e.target); const c = await api("/api/cases/" + encodeURIComponent(f.get("caseId")) + "/create", { method: "POST", body: JSON.stringify({ brief: f.get("brief"), stack: f.get("stack") }) }); selected = c.caseId; await loadCases(); render(c); e.target.reset(); } catch (x) { error(x.message); } };
$("refresh").onclick = () => loadCases().catch(e => error(e.message)); loadCases().catch(e => error(e.message));
</script>
</body>
</html>
