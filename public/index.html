<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delivery verifier</title>
  <style>
    :root{font:15px system-ui,sans-serif;color:#eef4ff;background:#0c1220}*{box-sizing:border-box}main{max-width:1100px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:280px 1fr;gap:18px}.panel{background:#141d2d;border:1px solid #293a52;border-radius:12px;padding:18px;margin-bottom:14px}label{display:grid;gap:6px;margin:10px 0;color:#aebdd0}input,textarea,select{width:100%;padding:9px;background:#0d1523;color:inherit;border:1px solid #3a4b64;border-radius:6px}textarea{min-height:90px}button{padding:9px 12px;border:0;border-radius:6px;background:#59dfc4;color:#062824;font-weight:700;margin:3px;cursor:pointer}.muted{color:#9babbe}.error{background:#562b38;padding:10px;border-radius:6px;margin:10px 0}.case{padding:10px;border:1px solid #293a52;border-radius:6px;margin:6px 0;cursor:pointer}.badge{color:#9ff7df}.hidden{display:none}@media(max-width:750px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <header><h1>Delivery verifier</h1><p class="muted">Hosted multi-user delivery verification</p></header>
  <div id="error" class="error hidden"></div>
  <section id="auth" class="panel"><h2>Sign in</h2><form id="login"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button>Log in</button></form><hr><h3>Create account</h3><form id="signup"><label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="10" required></label><label>Role<select name="role"><option>client</option><option>worker</option><option>reviewer</option></select></label><label>PayPal sandbox email<input name="paypalEmail" type="email" required></label><button>Sign up</button></form></section>
  <section id="app" class="hidden"><p>Signed in as <b id="identity"></b> <button id="logout">Log out</button></p><div class="grid"><aside><section class="panel"><h2>Cases</h2><div id="cases"></div></section><section id="new-case" class="panel"><h3>New case</h3><form><label>Case ID<input name="id" pattern="[A-Za-z0-9._-]+" required></label><label>Brief<textarea name="brief" required></textarea></label><label>Stack<input name="stack" value="Node 20" required></label><label>Worker email<input name="workerEmail" type="email" required></label><button>Create case</button></form></section></aside><section id="detail"><div class="panel muted">Select a case.</div></section></div></section>
</main><script>
const $=id=>document.getElementById(id);let csrf="",selected="";
function showError(e){$("error").textContent=e.message||e;$("error").classList.remove("hidden")}function clearError(){$("error").classList.add("hidden")}
async function api(url,options={}){options.headers={"Content-Type":"application/json","x-csrf-token":csrf,...(options.headers||{})};const r=await fetch(url,options);csrf=r.headers.get("x-csrf-token")||csrf;const b=r.status===204?{}:await r.json();if(!r.ok)throw Error(b.error||"Request failed");return b}
async function refresh(){const rows=await api("/api/cases");$("cases").innerHTML=rows.length?rows.map(c=>`<div class="case" data-id="${c.id}"><b>${c.id}</b><br><span class="badge">${c.status}</span></div>`).join(""):"<p class='muted'>No cases yet.</p>";document.querySelectorAll(".case").forEach(x=>x.onclick=()=>loadCase(x.dataset.id))}
async function loadCase(id){selected=id;const c=await api("/api/cases/"+encodeURIComponent(id));$("detail").innerHTML=`<section class="panel"><h2>${c.id}</h2><p>${c.brief}</p><p class="muted">${c.stack}</p><h3>Criteria</h3><p>${c.criteria?.status||"not generated"}</p><button onclick="action('criteria')">Generate criteria</button><button onclick="action('approve')">Approve criteria</button><h3>Funding</h3><p>${c.payment?.orderId||"not funded"} ${c.payment?.authorizationId||""}</p><button onclick="action('fund')">Fund</button><button onclick="action('status')">Check PayPal status</button><h3>Submission</h3><form id="upload"><input type="file" name="files" multiple><button>Upload</button></form><button onclick="action('verify')">Run verification</button></section>`;$("upload").onsubmit=async e=>{e.preventDefault();try{const r=await fetch("/api/cases/"+selected+"/upload",{method:"POST",headers:{"x-csrf-token":csrf},body:new FormData(e.target)});csrf=r.headers.get("x-csrf-token")||csrf;if(!r.ok)throw Error((await r.json()).error);await loadCase(selected)}catch(e){showError(e)}}}
async function action(name){try{const body=name==="fund"?JSON.stringify({amount:"10.00",currency:"USD"}):undefined;await api("/api/cases/"+selected+"/"+name,{method:"POST",body});await loadCase(selected);await refresh()}catch(e){showError(e)}}
async function signedIn(){try{const m=await api("/api/auth/me");$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("identity").textContent=`${m.user.name} (${m.user.role})`;if(m.user.role!=="client")$("new-case").classList.add("hidden");await refresh()}catch{}}
async function auth(form,path){try{const data=Object.fromEntries(new FormData(form));const m=await api(path,{method:"POST",body:JSON.stringify(data)});csrf=m.csrf||csrf;await signedIn()}catch(e){showError(e)}}
$("login").onsubmit=e=>{e.preventDefault();auth(e.target,"/api/auth/login")};$("signup").onsubmit=e=>{e.preventDefault();auth(e.target,"/api/auth/signup")};$("logout").onclick=async()=>{await api("/api/auth/logout",{method:"POST"});location.reload()};$("new-case").querySelector("form").onsubmit=async e=>{e.preventDefault();try{await api("/api/cases",{method:"POST",body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();await refresh()}catch(x){showError(x)}};fetch("/health").then(r=>{csrf=r.headers.get("x-csrf-token")||"";return signedIn()});
</script></body></html>
